name: Orbit
options:
  bundleIdPrefix: com.orbit.app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0" # language mode, not toolchain version
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # TODO: set your Apple Developer Team ID

# All non-UI code lives in the OrbitKit package at the repository root, so
# these targets carry only SwiftUI/WidgetKit/AppIntents code and nothing is
# compiled twice.
packages:
  OrbitKit:
    path: ..

targets:
  OrbitApp:
    type: application
    platform: macOS
    sources:
      - path: OrbitApp
    dependencies:
      - target: OrbitWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app
        PRODUCT_NAME: Orbit
        INFOPLIST_FILE: OrbitApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: OrbitApp/OrbitApp.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    info:
      path: OrbitApp/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: OrbitApp/OrbitApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.orbit.app

  OrbitWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: OrbitWidget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - package: OrbitKit
        product: OrbitCore
      - package: OrbitKit
        product: OrbitProviders
      - package: OrbitKit
        product: OrbitPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app.OrbitWidget
        PRODUCT_NAME: OrbitWidget
        INFOPLIST_FILE: OrbitWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: OrbitWidget/OrbitWidget.entitlements
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
    info:
      path: OrbitWidget/Info.plist
      properties:
        CFBundleDisplayName: OrbitWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OrbitWidget/OrbitWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.orbit.app

# OrbitKit's own tests run with `swift test` and are also reachable from the
# scheme below, so Cmd-U in Xcode exercises them too.
schemes:
  Orbit:
    build:
      targets:
        OrbitApp: all
        OrbitWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrbitCoreTests
        - OrbitProvidersTests
        - OrbitPresentationTests
    archive:
      config: Release
