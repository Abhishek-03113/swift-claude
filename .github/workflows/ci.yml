name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: OrbitKit (build + test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    name: App + widget (build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build
        run: |
          xcodebuild \
            -project App/Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
